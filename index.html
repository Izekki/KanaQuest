      <div style="padding: 2rem; max-width: 800px; margin: 0 auto; font-family: system-ui, sans-serif; color: #38181e; line-height: 1.6;">
        <h1>KanaQuest - Aprende y repasa japonés gratis</h1>
        <p>
          KanaQuest es una plataforma educativa interactiva diseñada para aprender, practicar y dominar los silabarios japoneses <strong>Hiragana</strong> y <strong>Katakana</strong>, caracteres <strong>Kanji</strong>, vocabulario esencial y estructura gramatical de oraciones mediante dinámicas gamificadas.
        </p>
        <h2>Modos de Aprendizaje:</h2>
        <ul>
          <li><strong>Reconocimiento:</strong> Identificación fonética y visual de caracteres kanji y kana.</li>
          <li><strong>Par-Parejas:</strong> Rondas de memoria asociativa entre caracteres, lecturas y significados.</li>
          <li><strong>Constructor de Oraciones:</strong> Ensamblado sintáctico de oraciones en japonés respetando partículas gramaticales.</li>
          <li><strong>Catálogo de Vocabulario:</strong> Repaso continuo con sistema de repetición espaciada y racha diaria.</li>
        </ul>
        <p>Para disfrutar de la experiencia interactiva completa de KanaQuest, por favor activa JavaScript en tu navegador.</p>
      </div>
